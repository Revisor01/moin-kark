name: API Deploy

# Baut das API-Image, legt es in der GitHub Container Registry ab und lässt
# Portainer den Stack `moinkark-api` damit neu ausrollen. Danach wartet der Lauf,
# bis https://api.moin-kark.de/ den gebauten Commit meldet und der Feed
# antwortet. Erst dann ist er grün.
#
# Ablauf, Secret und Notfallweg: docs/deploy.md.
#
# Startet von selbst bei jedem Push auf main, der die API betrifft. Von Hand
# (auch für den Cloud-Agenten): Actions → „API Deploy" → Run workflow, oder
#   gh workflow run api-deploy.yml

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - ".github/workflows/api-deploy.yml"
  workflow_dispatch:

# Nie zwei Deploys gleichzeitig. Ein laufender wird nicht abgebrochen, der
# nächste wartet: Ein abgebrochener Lauf könnte zwischen Push und Webhook
# stehen bleiben.
concurrency:
  group: api-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Muss zu `image:` im Portainer-Stack passen (Vorlage: apps/api/docker-compose.yml).
  IMAGE: ghcr.io/revisor01/moinkark-api
  API_URL: https://api.moin-kark.de

jobs:
  test:
    name: Tests der API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck:api

      - name: Tests (shared + api)
        run: |
          npm test --workspace packages/shared
          npm test --workspace apps/api

  deploy:
    name: Bauen und ausrollen
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Bei GHCR anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` zieht Portainer beim Webhook. Das Commit-Tag bleibt als
      # Rückfallpunkt stehen: Stack-Image auf `sha-<commit>` stellen = Rollback.
      - name: Image bauen und hochladen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Der Webhook zieht `latest` neu und erstellt den Container neu — die
      # Tokens bleiben dabei im Stack-Env von Portainer, sie kommen nie in die CI.
      - name: Portainer-Webhook auslösen
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_API }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::Secret PORTAINER_WEBHOOK_API fehlt — Image liegt in GHCR, ausgerollt wurde nichts. Siehe docs/deploy.md."
            exit 1
          fi
          curl -fsS -X POST --max-time 120 "$WEBHOOK_URL"

      # Ein grüner Healthcheck beweist nicht, dass das NEUE Image läuft — der
      # alte Container antwortet genauso. Deshalb auf den Commit warten.
      - name: Warten, bis der neue Stand antwortet
        run: |
          for i in $(seq 1 60); do
            rev=$(curl -fsS --max-time 10 "$API_URL/" | jq -r '.revision // empty' || true)
            if [ "$rev" = "$GITHUB_SHA" ]; then
              echo "Neuer Stand läuft (${rev:0:7}) nach $((i * 5)) s."
              break
            fi
            if [ "$i" = 60 ]; then
              echo "::error::Nach 5 Minuten meldet $API_URL/ noch '${rev:-nichts}' statt $GITHUB_SHA."
              exit 1
            fi
            sleep 5
          done

      # Nach dem Start lädt die API erst die Termine (Status `starting`, 503).
      - name: Feed prüfen
        run: |
          for i in $(seq 1 36); do
            code=$(curl -s -o health.json -w '%{http_code}' --max-time 10 "$API_URL/healthz" || true)
            if [ "$code" = 200 ]; then break; fi
            if [ "$i" = 36 ]; then
              echo "::error::/healthz antwortet nach 3 Minuten mit $code."
              cat health.json || true
              exit 1
            fi
            sleep 5
          done
          jq -r '"Zustand: \(.status), \(.events) Termine, \(.orgsOk) Gemeinden ok, \(.orgsFailed) ausgefallen"' health.json
          n=$(curl -fsS --max-time 30 "$API_URL/categories.json" | jq 'length')
          echo "categories.json: $n Kategorien"
          if [ "$n" -lt 1 ]; then
            echo "::error::categories.json ist leer."
            exit 1
          fi
          {
            echo "### API ausgerollt"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo "- $(jq -r '"Zustand \(.status), \(.events) Termine"' health.json)"
            echo "- Kategorien: $n"
          } >> "$GITHUB_STEP_SUMMARY"
