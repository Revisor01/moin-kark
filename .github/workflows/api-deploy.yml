name: API Deploy

# Baut das API-Image, legt es in der GitHub Container Registry ab und lässt
# Portainer den Stack `moinkark-api` damit neu ausrollen. Danach wartet der Lauf,
# bis https://api.moin-kark.de/ den gebauten Commit meldet und der Feed
# antwortet. Erst dann ist er grün. Rollback: Stack-Image auf `sha-<commit>`.
#
# Startet von selbst bei jedem Push auf main, der die API betrifft. Von Hand:
# Actions → „API Deploy" → Run workflow, oder
#   gh workflow run api-deploy.yml

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - ".github/workflows/api-deploy.yml"
  workflow_dispatch:

# Nie zwei Deploys gleichzeitig. Ein laufender wird nicht abgebrochen, der
# nächste wartet: Ein abgebrochener Lauf könnte zwischen Push und Webhook
# stehen bleiben.
concurrency:
  group: api-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_URL: https://api.moin-kark.de

jobs:
  test:
    name: Tests der API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck:api

      - name: Tests (shared + api)
        run: |
          npm test --workspace packages/shared
          npm test --workspace apps/api

  image:
    needs: test
    uses: Revisor01/workflows/.github/workflows/docker-image.yml@59236255da497972cdac8407c9af45d994ad0fcb # 1.4.1
    permissions:
      contents: read
      packages: write
    with:
      # Muss zu `image:` im Portainer-Stack passen (Vorlage: apps/api/docker-compose.yml).
      image: ghcr.io/revisor01/moinkark-api
      dockerfile: apps/api/Dockerfile
      build-args: GIT_SHA=${{ github.sha }}

  # Ein gesunder Dienst kann noch der alte Container sein; deshalb wartet der
  # Deploy auf den gebauten Commit unter `revision`.
  deploy:
    needs: image
    uses: Revisor01/workflows/.github/workflows/portainer-deploy.yml@59236255da497972cdac8407c9af45d994ad0fcb # 1.4.1
    with:
      pruef-url: https://api.moin-kark.de/
      revision-feld: .revision
    secrets:
      webhook: ${{ secrets.PORTAINER_WEBHOOK_API }}

  feed:
    name: Feed prüfen
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Nach dem Start lädt die API erst die Termine (Status `starting`, 503).
      - name: Feed prüfen
        run: |
          for i in $(seq 1 36); do
            code=$(curl -s -o health.json -w '%{http_code}' --max-time 10 "$API_URL/healthz" || true)
            if [ "$code" = 200 ]; then break; fi
            if [ "$i" = 36 ]; then
              echo "::error::/healthz antwortet nach 3 Minuten mit $code."
              cat health.json || true
              exit 1
            fi
            sleep 5
          done
          jq -r '"Zustand: \(.status), \(.events) Termine, \(.orgsOk) Gemeinden ok, \(.orgsFailed) ausgefallen"' health.json
          n=$(curl -fsS --max-time 30 "$API_URL/categories.json" | jq 'length')
          echo "categories.json: $n Kategorien"
          if [ "$n" -lt 1 ]; then
            echo "::error::categories.json ist leer."
            exit 1
          fi
          {
            echo "### API ausgerollt"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo "- $(jq -r '"Zustand \(.status), \(.events) Termine"' health.json)"
            echo "- Kategorien: $n"
          } >> "$GITHUB_STEP_SUMMARY"
