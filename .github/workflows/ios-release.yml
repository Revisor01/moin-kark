name: iOS Release Build

# Baut das iOS-Release auf einem GitHub-Runner mit RELEASE-macOS und lädt es
# zu App Store Connect hoch. Hintergrund: Builds von Beta-macOS-Maschinen
# lehnt Apple mit ITMS-90111 ab (Beta-Host-Stempel im Binary) — der lokale
# Entwickler-Mac läuft auf macOS-Beta, daher baut die CI.
#
# Version und Build-Nummer kommen aus apps/app/app.json (einzige Quelle):
# `expo prebuild` schreibt sie in die Info.plist, scripts/apply-version.sh
# zieht die pbxproj nach und prüft beides. Vor dem Dispatch dort bumpen und
# committen. Ablauf und Secrets: docs/store-release.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-upload:
    # macos-26 statt macos-15: Xcode 26.3 (das Maximum von macos-15) bricht bei
    # Expo-Projekten im Archiv mit einem Swift-Compilerfehler in expo-modules-jsi
    # ab; mit Xcode 26.6 baut derselbe Stand durch.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Neuestes stabiles Xcode wählen
        run: |
          set -euo pipefail
          # Beta-Installationen ausschließen — genau deren Stempel verursachen
          # ITMS-90111. Sortiert wird nach der herausgezogenen Versionsnummer:
          # ein `sort -V` über den ganzen Dateinamen nimmt 26.4.1 statt 26.6.
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -iv beta \
            | sed -E 's/.*Xcode_([0-9.]+)\.app/\1 &/' | sort -k1,1V | tail -1 | cut -d' ' -f2)
          if [ -z "$XCODE" ]; then XCODE=/Applications/Xcode.app; fi
          echo "Verwende: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          # 26.3 ist bekannt kaputt (siehe oben), 26.6 nachweislich gut.
          MIN_XCODE=26.4
          IST=$(xcodebuild -version | sed -nE 's/^Xcode ([0-9.]+).*/\1/p')
          if [ "$(printf '%s\n%s\n' "$MIN_XCODE" "$IST" | sort -V | head -1)" != "$MIN_XCODE" ]; then
            echo "FEHLER: Xcode $IST ist älter als die Mindestversion $MIN_XCODE — dieses Runner-Image taugt nicht (anderes Image wählen oder Mindestversion bewusst senken)."
            exit 1
          fi
          SDK_STAMP=$(plutil -extract ProductBuildVersion raw "$XCODE/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/"iPhoneOS*.sdk/SDKSettings.plist 2>/dev/null | head -1 || true)
          echo "iOS-SDK ProductBuildVersion: ${SDK_STAMP:-unbekannt}"

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # Workspace: allein der Root-Lock ist maßgeblich (apps/app hat keinen).
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Natives Projekt aus app.json aktualisieren
        working-directory: apps/app
        # Ohne --clean: Das versionierte ios/ bleibt stehen (Team und
        # Signing-Stil in der pbxproj), prebuild trägt nur Version, Build-Nummer
        # und Plugin-Änderungen nach. --no-install, weil npm ci schon lief und
        # die Pods gleich mit Wiederholung installiert werden.
        env:
          CI: 1
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --no-install
          # prebuild schreibt nur die Info.plist; das Skript zieht die pbxproj
          # nach und bricht ab, wenn beide nicht auf app.json stehen.
          ./scripts/apply-version.sh

      - name: CocoaPods installieren
        working-directory: apps/app/ios
        # React Native 0.85 lädt den vorgebauten Kern (~94 MB) von Maven Central;
        # ein einziger Netzabriss lässt sonst den ganzen Schritt sterben.
        run: |
          set -o pipefail
          for versuch in 1 2 3; do
            if pod install 2>&1 | tail -20; then
              exit 0
            fi
            echo "pod install fehlgeschlagen (Versuch $versuch/3)"
            [ "$versuch" -lt 3 ] && sleep 20
          done
          echo "FEHLER: pod install nach 3 Versuchen fehlgeschlagen."
          exit 1

      - name: Signing-Keychain einrichten
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > dist.p12
          security create-keychain -p ci-build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-build build.keychain
          security set-keychain-settings -t 3600 build.keychain
          security import dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          # Ohne diesen Schritt hängt codesign headless am Zugriffsdialog.
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-build build.keychain >/dev/null
          rm dist.p12

      - name: ASC-API-Key ablegen
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archiv bauen
        working-directory: apps/app/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # -allowProvisioningUpdates + ASC-Key: Xcode zieht Profile selbst, kein
        # Profil-Gefrickel. Der MapLibre-Rahmen kommt per Swift Package direkt
        # von GitHub (exakte Version im Podspec) — der lokale Mirror aus dem
        # README ist hier nicht nötig.
        run: |
          set -o pipefail
          xcodebuild -workspace MoinKark.xcworkspace -scheme MoinKark -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MoinKark.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40

      - name: IPA exportieren
        working-directory: apps/app/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          # teamID: Apple-Team „Simon Luthe“ — steht so im Provisioning-Profil
          # der App und in den Ziel-Einstellungen der pbxproj.
          cat > ExportOptions-ci.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>stripSwiftSymbols</key><true/>
            <key>teamID</key><string>J459G9CJT5</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/MoinKark.xcarchive \
            -exportPath build/export -exportOptionsPlist ExportOptions-ci.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -10

      - name: Zu App Store Connect hochladen
        working-directory: apps/app/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f build/export/MoinKark.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
