name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Montags 6:00 UTC — findet neue Advisories auch ohne Commit.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Tests und Typecheck
    runs-on: ubuntu-latest
    # Ohne Limit läuft ein hängender Job bis zum Standard von sechs Stunden.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  audit:
    name: Abhängigkeiten prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Was ausgeliefert wird, muss sauber sein. Dev-Abhängigkeiten laufen nie
      # auf einem Server und brechen den Lauf deshalb nicht.
      #
      # Schwelle „high": Der offene Befund decode-uri-component (moderate)
      # steckt unter expo-router und lässt sich nur durch dessen Downgrade lösen
      # — die gepatchte Fassung ist ESM-only, query-string lädt sie per require().
      # Auf „moderate" wäre der Lauf dauerhaft rot und niemand sähe den nächsten
      # echten Befund.
      #
      # Ausnahmen ab „high" stehen einzeln und begründet in
      # .github/audit-allowlist.json. Ein Eintrag lässt genau eine Meldung zu,
      # nie eine Schwelle — die Regeln stehen im Skript.
      - name: Produktiv-Abhängigkeiten
        run: node .github/scripts/audit.mjs

      # Nur zur Ansicht — schlägt bewusst nicht fehl, sonst blockiert ein
      # Befund in einem Build-Werkzeug jeden Merge.
      - name: Alle Abhängigkeiten (nur Bericht)
        if: always()
        run: npm audit || true
