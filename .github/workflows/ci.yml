name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Montags 6:00 UTC — findet neue Advisories auch ohne Commit.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Tests und Typecheck
    runs-on: ubuntu-latest
    # Ohne Limit läuft ein hängender Job bis zum Standard von sechs Stunden.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  audit:
    name: Abhängigkeiten prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Schwelle high, weil decode-uri-component (moderate) unter expo-router sonst dauerhaft rot wäre; Ausnahmen in .github/audit-allowlist.json.
      - name: Produktiv-Abhängigkeiten
        run: node .github/scripts/audit.mjs

      # Nur zur Ansicht, sonst blockiert ein Fund in Build-Werkzeugen jeden Merge.
      - name: Alle Abhängigkeiten (nur Bericht)
        if: always()
        run: npm audit || true
