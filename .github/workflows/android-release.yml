name: Android Release Build

# Baut das signierte AAB und lädt es über den Baustein play-upload.yml
# (Revisor01/workflows) in die angegebenen Tracks. Google startet die Prüfung
# mit dem Track-Commit von selbst.
#
# Version und versionCode kommen aus apps/app/app.json (einzige Quelle;
# `expo prebuild` schreibt sie in android/app/build.gradle). Vor dem Dispatch:
# versionCode bumpen, apps/app/release-notes-de.txt aktualisieren, committen.

on:
  workflow_dispatch:
    inputs:
      tracks:
        description: "Ziel-Tracks (kommagetrennt, z. B. internal,alpha oder internal,alpha,production)"
        # Seit 26.09.2026 immer beide Testwege: alpha = geschlossener Test
        # (die zwölf Tester für den Production-Access), internal = einzeln
        # eingeladene Personen. Produktion erst bewusst per Input.
        default: "internal,alpha"
        required: true
      release_status:
        description: "Freigabestatus im Track. completed = sofort an die Tester:innen (Normalfall). draft = landet nur als Entwurf in der Konsole und erreicht niemanden."
        type: choice
        options: [completed, draft]
        default: completed
      dry_run:
        description: "Dry-Run: kompletter Durchlauf, aber Play-Edit wird verworfen (kein Release)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tracks-pruefen:
    # Tracks und Neuigkeiten vor dem Bau prüfen, nicht erst nach 40 Minuten.
    uses: Revisor01/workflows/.github/workflows/play-upload.yml@59236255da497972cdac8407c9af45d994ad0fcb # 1.4.1
    with:
      paket: de.godsapp.moinkark
      tracks: ${{ inputs.tracks }}
      status: ${{ inputs.release_status }}
      production-anteil: "1"
      release-notes-datei: apps/app/release-notes-de.txt
      nur-pruefen: true

  build:
    needs: [tracks-pruefen]
    runs-on: ubuntu-latest
    # 45 Minuten waren zu knapp: Ohne Gradle-Zwischenspeicher lud der erste
    # Lauf 41,6 Minuten, der zweite überschritt das Limit bei 46,3 und wurde
    # mitten im Bundle-Bau abgebrochen. Mit dem Cache unten liegen die Läufe
    # deutlich darunter; 75 Minuten lassen Luft für einen kalten Cache.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 21 einrichten
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          # Gradle-Zwischenspeicher: Ohne ihn lädt und baut jeder Lauf alles neu
          # (41–46 Min, ein Lauf lief ins Zeitlimit). Der Schlüssel hängt an den
          # Gradle-Dateien, ein Wechsel der Abhängigkeiten erneuert ihn also.
          cache: gradle

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          # Workspace: allein der Root-Lock ist maßgeblich (apps/app hat keinen).
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: "Dry-Run: versionCode temporär anheben"
        if: ${{ inputs.dry_run }}
        working-directory: apps/app
        # +10000, damit der Upload nicht an einem bereits verwendeten Code
        # scheitert. Die Edit wird am Ende verworfen — der Code wird NICHT
        # verbraucht, app.json im Repo bleibt unberührt.
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json'));j.expo.android.versionCode+=10000;fs.writeFileSync('app.json',JSON.stringify(j,null,2)+'\n');console.log('Dry-Run versionCode:',j.expo.android.versionCode)"

      - name: Natives Projekt aus app.json aktualisieren
        working-directory: apps/app
        # --no-clean (ab SDK 57 nötig): Das versionierte android/ mit dem
        # Release-Signing bleibt stehen, prebuild trägt nur Version, versionCode
        # und Plugin-Änderungen nach. --no-install, weil npm ci schon lief.
        env:
          CI: 1
        run: npx expo prebuild --platform android --no-install --no-clean

      - name: Signing und Version im Gradle-Projekt prüfen
        working-directory: apps/app
        # `expo prebuild --clean` setzt das Release auf den DEBUG-Key zurück —
        # das fiele sonst erst beim Play-Upload auf. Hier bricht der Lauf ab,
        # bevor Minuten in einen unbrauchbaren Build fließen.
        run: |
          set -euo pipefail
          GRADLE=android/app/build.gradle
          # Kommentarzeilen ausklammern — gezählt wird nur Code.
          CODE=$(grep -vE '^\s*//' "$GRADLE")
          echo "$CODE" | grep -q 'signingConfig signingConfigs.release' \
            || { echo "FEHLER: $GRADLE hat kein Release-Signing (nach prebuild --clean wiederherstellen)."; exit 1; }
          if [ "$(echo "$CODE" | grep -c 'signingConfig signingConfigs.debug')" != "1" ]; then
            echo "FEHLER: $GRADLE signiert mehr als den Debug-Build mit dem Debug-Key."
            exit 1
          fi
          ERWARTET_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          ERWARTET_NAME=$(node -p "require('./app.json').expo.version")
          grep -q "versionCode $ERWARTET_CODE\$" "$GRADLE" \
            || { echo "FEHLER: versionCode $ERWARTET_CODE fehlt in $GRADLE."; grep -n versionCode "$GRADLE"; exit 1; }
          grep -q "versionName \"$ERWARTET_NAME\"" "$GRADLE" \
            || { echo "FEHLER: versionName $ERWARTET_NAME fehlt in $GRADLE."; grep -n versionName "$GRADLE"; exit 1; }
          echo "OK: Release-Signing vorhanden, Version $ERWARTET_NAME ($ERWARTET_CODE)."

      - name: Keystore ablegen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks

      - name: Signiertes AAB bauen
        working-directory: apps/app/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            "-PMOINKARK_KEYSTORE_PATH=/tmp/release.jks" \
            "-PMOINKARK_KEYSTORE_PASSWORD=$KS_PASS" \
            "-PMOINKARK_KEY_ALIAS=$KEY_ALIAS" \
            "-PMOINKARK_KEY_PASSWORD=$KEY_PASS"
          ls -la app/build/outputs/bundle/release/app-release.aab

      - name: Signatur und Version des AAB prüfen
        working-directory: apps/app
        # Der Debug-Key trägt „CN=Android Debug“; ein unsigniertes Bundle
        # meldet keytool als „Not a signed jar file“. Beides darf nicht zu
        # Google — und das gemergte Manifest muss die erwartete Version tragen.
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          CERT=$(keytool -printcert -jarfile "$AAB" 2>&1 || true)
          if echo "$CERT" | grep -q "Not a signed jar file"; then
            echo "FEHLER: AAB ist nicht signiert."; exit 1
          fi
          if echo "$CERT" | grep -q "Android Debug"; then
            echo "FEHLER: AAB ist mit dem DEBUG-Key signiert."; exit 1
          fi
          echo "$CERT" | grep -m1 "Owner:"
          MANIFEST=$(find android/app/build/intermediates/merged_manifests -path '*release*' -name AndroidManifest.xml | head -1)
          [ -n "$MANIFEST" ] || { echo "FEHLER: gemergtes Release-Manifest nicht gefunden."; exit 1; }
          ERWARTET_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          ERWARTET_NAME=$(node -p "require('./app.json').expo.version")
          grep -q "android:versionCode=\"$ERWARTET_CODE\"" "$MANIFEST" \
            || { echo "FEHLER: Manifest trägt nicht versionCode $ERWARTET_CODE."; grep -o 'android:versionCode="[^"]*"' "$MANIFEST"; exit 1; }
          grep -q "android:versionName=\"$ERWARTET_NAME\"" "$MANIFEST" \
            || { echo "FEHLER: Manifest trägt nicht versionName $ERWARTET_NAME."; grep -o 'android:versionName="[^"]*"' "$MANIFEST"; exit 1; }
          echo "OK: Release-Signatur, Version $ERWARTET_NAME ($ERWARTET_CODE)."

      - name: AAB für den Upload bereitstellen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aab
          path: apps/app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1

  upload:
    # Eigener Job, damit der Schlüssel des Dienstkontos nicht neben npm und
    # Gradle liegt. production-anteil 1: production geht wie bisher an alle.
    needs: [build]
    uses: Revisor01/workflows/.github/workflows/play-upload.yml@59236255da497972cdac8407c9af45d994ad0fcb # 1.4.1
    with:
      paket: de.godsapp.moinkark
      tracks: ${{ inputs.tracks }}
      status: ${{ inputs.release_status }}
      production-anteil: "1"
      release-notes-datei: apps/app/release-notes-de.txt
      artefakt: aab
      dry-run: ${{ inputs.dry_run }}
    secrets:
      dienstkonto: ${{ secrets.GPLAY_SA_JSON_BASE64 }}
