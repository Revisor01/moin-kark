version: 2
updates:
  # Ein npm-Workspace: Der Root-Lock ist maßgeblich, deshalb genügt ein Eintrag.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Sonst kommen zwanzig einzelne PRs pro Woche.
      patch-und-minor:
        update-types:
          - minor
          - patch
    ignore:
      # Die Versionen legt das Expo-SDK fest, sonst laufen App und SDK auseinander.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-worklets
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-community/datetimepicker"
      # Was das SDK mit ~ festlegt, bekommt Patches, mehr nicht.
      - dependency-name: expo
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-native-gesture-handler
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-native-safe-area-context
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-native-screens
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-native-web
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Typen folgen der Laufzeit (React-Version, Node 26).
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 ist ein Compilerwechsel, kein Routine-Update.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      # Gebündelt, weil jeder Merge an api-deploy.yml die API neu ausrollt.
      actions:
        patterns: ["*"]

  # Node-Hauptversionen gehen mit CI und @types/node zusammen.
  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
