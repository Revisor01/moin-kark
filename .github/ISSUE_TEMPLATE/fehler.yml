name: Fehler melden
description: Etwas funktioniert nicht wie erwartet.
labels: ["fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für die Meldung. Bitte keine Zugangsdaten, Server-Adressen oder
        Kontonamen eintragen; dieses Issue ist öffentlich. Sicherheitslücken
        bitte über den Weg in SECURITY.md melden.
  - type: textarea
    id: beobachtung
    attributes:
      label: Beobachtung
      description: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: erwartung
    attributes:
      label: Erwartung
      description: Was hättest du stattdessen erwartet?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachvollziehen
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version der App (oder „Web“)
      placeholder: "z. B. 1.0.0"
    validations:
      required: true
  - type: input
    id: geraet
    attributes:
      label: Gerät und Betriebssystem
      placeholder: "z. B. iPhone 16, iOS 26.1"
