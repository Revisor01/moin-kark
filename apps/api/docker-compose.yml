# Deployment-Stack für die Moin-Kark-API auf server.godsapp.de
# (Apache/KeyHelp → Traefik:8888 → Container).
# Build-Kontext ist der Monorepo-Root, damit packages/shared mitkommt.
services:
  moinkark-api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: moinkark-api:latest
    container_name: moinkark-api
    restart: unless-stopped
    environment:
      PORT: "8787"
      CACHE_TTL_MS: "300000"
      DEFAULT_WINDOW_DAYS: "60"
      MAX_WINDOW_DAYS: "90"
      # karte.* = Web-App, moin-kark.de = Landingpage. Die Alt-Domain bleibt
      # vorerst erlaubt, damit bereits ausgelieferte App-Builds weiterlaufen.
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://karte.moin-kark.de,https://moin-kark.de,https://kkkarte.godsapp.de}"
      # Tokens werden über Portainer-Stack-ENV / .env injiziert (NIE im Repo).
      CD_TOKEN_2596: "${CD_TOKEN_2596:-}"
      CD_TOKEN_2619: "${CD_TOKEN_2619:-}"
      CD_TOKEN_2715: "${CD_TOKEN_2715:-}"
      CD_TOKEN_2718: "${CD_TOKEN_2718:-}"
      CD_TOKEN_2720: "${CD_TOKEN_2720:-}"
      CD_TOKEN_2722: "${CD_TOKEN_2722:-}"
      CD_TOKEN_2723: "${CD_TOKEN_2723:-}"
      CD_TOKEN_2724: "${CD_TOKEN_2724:-}"
      CD_TOKEN_2725: "${CD_TOKEN_2725:-}"
      CD_TOKEN_2729: "${CD_TOKEN_2729:-}"
      CD_TOKEN_2753: "${CD_TOKEN_2753:-}"
      CD_TOKEN_2936: "${CD_TOKEN_2936:-}"
      CD_TOKEN_2940: "${CD_TOKEN_2940:-}"
      CD_TOKEN_6572: "${CD_TOKEN_6572:-}"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moinkark-api.rule=Host(`api.moin-kark.de`)"
      - "traefik.http.services.moinkark-api.loadbalancer.server.port=8787"

networks:
  traefik:
    external: true
